name: Build Twende API Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/twende/pom.xml

      - name: Build Spring Boot JAR
        working-directory: backend/twende
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: twendeacr0844.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        working-directory: backend/twende
        run: |
          docker build \
            -t twendeacr0844.azurecr.io/twende-api:v1 \
            .
          docker push twendeacr0844.azurecr.io/twende-api:v1
