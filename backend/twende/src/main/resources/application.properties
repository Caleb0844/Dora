spring.application.name=twende

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/twende?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.points.place-contribution=${PLACE_CONTRIBUTION_POINTS:10}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.oauth2.google.enabled=${GOOGLE_OAUTH_ENABLED:false}
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth2.google.success-redirect-uri=${GOOGLE_SUCCESS_REDIRECT_URI:twende://auth/callback}

app.refresh-token.expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS:30}



app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

app.oauth2.google.backend-redirect-uri=${GOOGLE_BACKEND_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
